<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DepthSight AI Trading Platform</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="assets/logo-mark.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121518" />
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #121518;
            font-family: 'Roboto', sans-serif;
            overscroll-behavior: none;
        }
        #root {
            height: 100%;
        }
        .app-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
        }
        .app-loading svg {
            width: 96px;
            height: 96px;
        }

        /* 1. Describe the rotation animation itself */
        @keyframes rotate-spinner {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        /* 2. Apply the animation to our element */
        .logo-spinner-path {
            /* Rotation center matching local coordinates (25, 25) inside the translated group */
            transform-origin: 25px 25px; 
            animation: rotate-spinner 4s linear infinite;
            will-change: transform;
        }

    </style>
</head>
<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
        <div class="app-loading">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility" image-rendering="optimizeQuality">
                <defs>
                    <linearGradient id="loaderLogoTechGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#00D4FF"></stop>
                        <stop offset="100%" stop-color="#0066FF"></stop>
                    </linearGradient>
                    <linearGradient id="loaderLogoPulseGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#00D4FF" stop-opacity="0"></stop>
                        <stop offset="50%" stop-color="#00D4FF" stop-opacity="0.8"></stop>
                        <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"></stop>
                    </linearGradient>
                    <filter id="loaderLogoGlow">
                        <feGaussianBlur stdDeviation="2.5" result="coloredBlur"></feGaussianBlur>
                        <feMerge>
                            <feMergeNode in="coloredBlur"></feMergeNode>
                            <feMergeNode in="SourceGraphic"></feMergeNode>
                        </feMerge>
                    </filter>
                </defs>
                <g transform="translate(25, 25)">
                    <circle cx="25" cy="25" r="24" fill="none" stroke="url(#loaderLogoTechGradient)" stroke-width="2" opacity="0.8"></circle>
                    <circle cx="25" cy="25" r="18" fill="none" stroke="#00D4FF" stroke-width="1" opacity="0.5"></circle>
                    <circle cx="25" cy="25" r="12" fill="none" stroke="#00D4FF" stroke-width="1" opacity="0.4"></circle>
                    <path d="M 25 25 L 40 15 M 25 25 L 40 35 M 25 25 L 10 15 M 25 25 L 10 35" stroke="#0066FF" stroke-width="1" opacity="0.4"></path>
                    <circle cx="25" cy="25" r="8" fill="url(#loaderLogoTechGradient)" filter="url(#loaderLogoGlow)"></circle>
                    <circle cx="25" cy="25" r="4" fill="#FFFFFF" opacity="0.9"></circle>
                    <path d="M 25 5 L 25 10 M 25 40 L 25 45 M 5 25 L 10 25 M 40 25 L 45 25" stroke="url(#loaderLogoTechGradient)" stroke-width="2" stroke-linecap="round"></path>
                    <path class="logo-spinner-path" d="M 25 25 L 45 5" stroke="url(#loaderLogoPulseGradient)" stroke-width="2" opacity="0.7">
                        <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="4s" repeatCount="indefinite"></animateTransform>
                    </path>
                </g>
            </svg>
        </div>
    </div>
    <script type="module" src="index.tsx"></script>
</body>
</html>
