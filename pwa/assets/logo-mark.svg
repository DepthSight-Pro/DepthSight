<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility" image-rendering="optimizeQuality">
<defs>
	<linearGradient id="iconTechGradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00D4FF"/><stop offset="100%" stop-color="#0066FF"/></linearGradient>
	<linearGradient id="iconPulseGradient" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#00D4FF" stop-opacity="0"/><stop offset="50%" stop-color="#00D4FF" stop-opacity="0.8"/><stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/></linearGradient>
	<filter id="iconGlow"><feGaussianBlur stdDeviation="2.5" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<!-- Radar centered at (50,50), outer ring r=46 fills the 100x100 viewBox with 4px padding -->
<circle cx="50" cy="50" r="46" fill="none" stroke="url(#iconTechGradient)" stroke-width="3" opacity="0.8"/>
<circle cx="50" cy="50" r="34.5" fill="none" stroke="#00D4FF" stroke-width="1.8" opacity="0.5"/>
<circle cx="50" cy="50" r="23" fill="none" stroke="#00D4FF" stroke-width="1.8" opacity="0.4"/>
<path d="M 50 50 L 78.8 30.8 M 50 50 L 78.8 69.2 M 50 50 L 21.2 30.8 M 50 50 L 21.2 69.2" stroke="#0066FF" stroke-width="1.8" opacity="0.4"/>
<circle cx="50" cy="50" r="15.3" fill="url(#iconTechGradient)" filter="url(#iconGlow)"/>
<circle cx="50" cy="50" r="7.7" fill="#FFFFFF" opacity="0.9"/>
<path d="M 50 11.6 L 50 21.2 M 50 78.8 L 50 88.4 M 11.6 50 L 21.2 50 M 78.8 50 L 88.4 50" stroke="url(#iconTechGradient)" stroke-width="3" stroke-linecap="round"/>
<path d="M 50 50 L 88.4 11.6" stroke="url(#iconPulseGradient)" stroke-width="3" opacity="0.7">
	<animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="4s" repeatCount="indefinite"/>
</path>
</svg>
