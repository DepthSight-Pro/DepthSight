name: Run Pytest

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: |
        # prod_e2e opens live exchange connections and takes minutes per
        # exchange; it runs nightly/manually with PROD_E2E_ENABLED=1, never in CI.
        python -m pytest tests/ -m "not prod_e2e"
